name: run-export

# Fetches a run from the public website for the report writers (aivillage/export.py): GET /export is sealed to
# the public key in configs/export_key.json, so the box can sit on a branch of this public repo; only the private
# key's holder opens it. Pushed as `run-export` (one commit, replaced every time; delete the branch when done).

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Which run: 0 = the newest, 1 = the one before, ..."
        default: "0"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://ai-village.up.railway.app
      N: ${{ inputs.n }}
    steps:
      - name: Fetch the sealed run
        run: |
          case "$N" in ''|*[!0-9]*) echo "n must be a number"; exit 1;; esac
          curl -fsS --max-time 900 "$SITE_URL/export?n=$N" -o run.aivx
          head -c 5 run.aivx | grep -q AIVX1
          ls -l run.aivx
      - name: Push it to the run-export branch
        run: |
          mkdir out && cd out && git init -q -b run-export
          split -b 45m -d ../run.aivx run.aivx.part
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "Sealed run export (n=$N)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" run-export
