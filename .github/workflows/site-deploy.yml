name: site-deploy

# The public website (docs/site.md) runs the `site-live` branch on Railway, which redeploys on every push to it.
# This moves `site-live` to the `stable` tag (main's latest commit whose tests passed, tests.yml). An update
# restarts every game on the site, so it happens only when no village plays there (/healthz "playing": 0),
# or when the update has waited 12 hours (games resume from their last autosave).

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://ai-village.up.railway.app
      MAX_WAIT_HOURS: "12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move site-live to stable when the site is idle
        run: |
          git fetch -q -f origin 'refs/tags/stable:refs/tags/stable' 'refs/heads/*:refs/remotes/origin/*'
          target=$(git rev-parse 'stable^{commit}')
          if ! git rev-parse -q --verify origin/site-live >/dev/null; then
            echo "site-live does not exist yet: creating it"; git push origin "$target:refs/heads/site-live"; exit 0
          fi
          behind=$(git rev-list --count "origin/site-live..$target")
          if [ "$behind" = 0 ]; then echo "site is up to date"; exit 0; fi
          if ! git merge-base --is-ancestor origin/site-live "$target"; then
            echo "::warning::site-live is not behind stable (someone pushed to it directly); not touching it"; exit 0
          fi
          oldest=$(git log --reverse --format=%ct "origin/site-live..$target" | head -1)
          age=$(( $(date +%s) - oldest ))
          playing=$(curl -fsS --max-time 20 "$SITE_URL/healthz" | jq -r .playing || echo unknown)
          echo "behind by $behind commits, oldest waiting $((age / 60)) min, villages playing: $playing"
          if [ "$playing" = 0 ] || [ "$playing" = unknown ] || [ "$age" -gt $(( MAX_WAIT_HOURS * 3600 )) ]; then
            git push origin "$target:refs/heads/site-live"
          else
            echo "villages are playing: the update waits for the next check"
          fi
