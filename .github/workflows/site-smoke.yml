name: site-smoke
on:
  push:
    branches: [claude/project-thread-rb4ev3]
    paths: [.github/workflows/site-smoke.yml]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q httpx websockets
      - shell: python
        run: |
          import asyncio, httpx, websockets, time
          B = "https://ai-village.up.railway.app"; PW = "smoke-7f3k2q"
          c = httpx.Client(follow_redirects=False, timeout=60)
          print("healthz", c.get(B + "/healthz").text)
          print("root", c.get(B + "/").status_code)
          print("bad login", c.post(B + "/login", data={"password": "x"}).status_code)
          for i in range(40):  # the deploy of this commit may still be rolling out
              r = c.post(B + "/login", data={"password": PW, "next": "/"})
              if r.status_code == 303: break
              time.sleep(10)
          print("login", r.status_code)
          time.sleep(90)  # let this push's own deploy finish too
          r = c.post(B + "/login", data={"password": PW, "next": "/"}); print("login again", r.status_code)
          t = time.time(); r = c.get(B + "/"); print("index", r.status_code, "setup.js" in r.text, round(time.time() - t, 1), "s")
          s = c.get(B + "/api/settings").json(); print("hosted", s["hosted"], "key set", s["openrouter_key"]["set"])
          r = c.post(B + "/api/start", json={"brains": "mcp", "days": 1, "villagers": 3}); print("start", r.status_code)
          rem = c.get(B + "/api/remote").json(); base = rem["tunnel"]["url"]; print("public base", base)
          s2 = httpx.Client(timeout=60)
          print("join page", s2.get(base + rem["lobby"], headers={"accept": "text/html"}).status_code)
          take = s2.post(base + rem["lobby"] + "/take", json={"player": "Smoke", "ai": "claude"}).json(); print("take", take.get("name"))
          init = s2.post(base + take["path"], json={"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "smoke", "version": "1"}}}, headers={"accept": "application/json, text/event-stream"})
          print("mcp init", init.status_code, init.text[:80])
          print("public settings", s2.get(base + "/api/settings").status_code)
          cookie = "; ".join(f"{k}={v}" for k, v in c.cookies.items())
          async def ws():
              async with websockets.connect(B.replace("https", "wss") + "/ws", additional_headers={"Cookie": cookie}) as w:
                  n = 0
                  try:
                      while n < 20:
                          await asyncio.wait_for(w.recv(), 10); n += 1
                  except Exception as e:
                      print("ws stop", type(e).__name__)
                  print("ws messages", n)
          asyncio.run(ws())
          print("busy healthz", c.get(B + "/healthz").text)
          print("stop", c.post(B + "/api/stop", json={}).status_code)
