name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # the suite is split in two halves by file cost (tests/conftest.py, tests/durations.json)
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[live,dev]"
      # every test must run: a skip (missing fastapi, httpx or node) fails the job
      - run: python -m pytest -n 4 -ra
        env:
          AIV_NO_SKIPS: "1"
          AIV_SHARD: ${{ matrix.shard }}

  # one stable check name for branch protection and auto-merge: green only when every shard is
  tests-ok:
    if: always()
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pytest.result }}" = success
