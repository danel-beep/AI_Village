name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[live,dev]"
      # every test must run: a skip (missing fastapi, httpx or node) fails the job
      - run: python -m pytest -n 4 -ra
        env:
          AIV_NO_SKIPS: "1"

  lock:
    # uv.lock pins the exact packages the desktop launcher installs (`uv run --frozen`);
    # it must match pyproject.toml, or the launcher would refuse to start.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check

  stable-tag:
    # The launcher downloads the `stable` tag, so players only get commits whose tests passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pytest, lock]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag -f stable "$GITHUB_SHA"
          git push -f origin refs/tags/stable
