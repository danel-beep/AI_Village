# Пресет: суровые условия. Значения ручек как на экране «Новая деревня» (aivillage/knobs.py).
title: Суровый
about: >-
  «С нуля», но выжить труднее: еды в мире вдвое меньше и все начинают полуголодными, зимние ночи голоднее,
  бандиты и звери приходят чаще, реже предупреждают и они сильнее.
order: 3
knobs:
  food: scarce            # «Еды в мире: мало»
  winter_hunger: 16       # зимняя ночь отнимает 16 сытости сверх обычного (в «Обычном» 10)
  hostile_max_gap: 6      # бандиты или зверь не реже чем раз в 6 дней (в «Обычном» 10)
  threat_warn: 50         # заранее объявлены 50% (в «Обычном» 80%)
world:                    # нет на экране: сила бандитов и зверя (в «Обычном» 200 и 170)
  threats: {kinds: {raid: {hp: 240}, beast: {hp: 200}}}
