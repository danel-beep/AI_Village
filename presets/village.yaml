# Пресет: старт со стадии «Деревня» (всё нужное для неё уже построено, рынок открыт, монеты есть).
title: С деревни
about: >-
  То же «С нуля», но начинаем со стадии «Деревня»: дома, рынок и торговец уже есть, у всех есть монеты.
  Пропускает первые дни стройки, чтобы сразу смотреть торговлю, налоги и власть.
order: 2
