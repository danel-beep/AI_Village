[project]
name = "aivillage"
version = "0.1.0"
description = "A village simulation where every villager is an LLM agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
# everything CI needs to run the whole suite, server tests included (httpx drives FastAPI's TestClient)
dev = ["pytest>=8", "pytest-xdist>=3", "httpx>=0.27"]
live = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

# only `aivillage` is a Python package; viewer/, configs/, scenarios/ are data next to it
[tool.setuptools]
packages = ["aivillage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
