[project]
name = "aivillage"
version = "0.1.0"
description = "A village simulation where every villager is an LLM agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
