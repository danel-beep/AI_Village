# Опыт-развилка: та же деревня, те же беды, меняем одну вещь. Ветка B: Анна помнит, что Борис её выручил.
# Ветка AA (копия A без изменений) добавляется сама: по ней видно, насколько ветки расходятся случайно.
# Чтобы начать с настоящего сохранения, укажите from_save (файл .save.json или zip из «💾 Сохранить»).
title: "Опыт: развилка «добрая память»"
about: >-
  «С нуля» после трёх дней ботов. Ветка A как есть, AA её копия (контроль), в ветке B Анна помнит, что Борис
  выручил её едой. По два повтора каждой ветки. Смотрим, станут ли чаще подарки, сделки и разговоры.
config:
  preset: normal
  seed: 5
  characters: "off"
warmup:
  days: 3
  bots: builder
play:
  days: 2
  ai: all
  bots: builder
  max_cost: 0.3
  replicates: 2
arms:
  - name: B
    about: Анна помнит, что Борис её выручил
    villagers:
      Anna:
        memory:
          people: {Boris: "Gave me fish when my food ran out two days ago. I owe him one."}
