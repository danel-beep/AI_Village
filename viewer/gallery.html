<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея зданий и предметов</title>
<style>
  :root { --bg: #1e2a1e; --card: #2a3a2a; --ink: #f2ecd8; --dim: #b8c0a8; --grass: #5a9a3c; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 24px 0 8px; border-bottom: 1px solid #3a4a3a; padding-bottom: 4px; }
  p.note { color: var(--dim); margin: 0 0 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .b { background: var(--card); border-radius: 8px; padding: 8px; }
  .b .t { font-weight: 600; margin-bottom: 6px; }
  .lv { display: flex; gap: 6px; align-items: flex-end; }
  .lv figure { margin: 0; text-align: center; color: var(--dim); font-size: 12px; }
  canvas { image-rendering: pixelated; display: block; background: var(--grass); border-radius: 4px; }
  .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .icons figure { margin: 0; background: var(--card); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 12px; color: var(--dim); }
  .icons canvas { margin: 0 auto 4px; background: #3a4a3a; }
</style>
</head>
<body>
<main>
  <h1>Галерея зданий и предметов</h1>
  <p class="note">Режим «С нуля». Всё нарисовано кодом (viewer/buildart.js, viewer/icons.js). Уровень 1: ветки, плетень, солома, шкуры. Уровень 2: брёвна и доски, дранка, ставни. Уровень 3: камень, кирпич, черепица, стекло.</p>
  <div id="out"></div>
</main>
<script src="buildart.js"></script>
<script src="icons.js"></script>
<script>
  const out = document.getElementById('out'), SCALE = 3;
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
  const LV = ['', 'ур. 1', 'ур. 2', 'ур. 3'];
  for (const [group, title] of Object.entries(BuildArt.GROUPS)) {
    out.append(el('h2', '', 'Здания: ' + title.toLowerCase()));
    const grid = el('div', 'grid');
    for (const id of BuildArt.LIST.filter(k => BuildArt.KINDS[k].group === group)) {
      const k = BuildArt.KINDS[id], card = el('div', 'b'), row = el('div', 'lv');
      card.append(el('div', 't', k.name));
      for (let l = 1; l <= k.levels; l++) { const f = el('figure'); f.append(BuildArt.canvas(id, l, SCALE), el('figcaption', '', LV[l])); row.append(f); }
      card.append(row); grid.append(card);
    }
    out.append(grid);
  }
  out.append(el('h2', '', 'Стройплощадка'));
  const sites = el('div', 'grid');
  for (const [w, h, name] of [[40, 40, 'малая'], [56, 52, 'средняя'], [80, 60, 'большая']]) {
    const card = el('div', 'b'), row = el('div', 'lv'); card.append(el('div', 't', 'Стройка, ' + name));
    ['разметка', 'каркас', 'стены в лесах'].forEach((cap, i) => {
      const c = document.createElement('canvas'); c.width = w * SCALE; c.height = (h + 12) * SCALE;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.scale(SCALE, SCALE); BuildArt.site(g, w, h, i + 1, 0, 12);
      const f = el('figure'); f.append(c, el('figcaption', '', cap)); row.append(f);
    });
    card.append(row); sites.append(card);
  }
  out.append(sites);
  if (window.Icons) for (const [group, title] of Object.entries(Icons.GROUPS)) {
    out.append(el('h2', '', title));
    const grid = el('div', 'icons');
    for (const id of Icons.LIST.filter(k => Icons.ITEMS[k].group === group)) {
      const f = el('figure'); f.append(Icons.canvas(id, 4), el('figcaption', '', Icons.ITEMS[id].name)); grid.append(f);
    }
    out.append(grid);
  }
</script>
</body>
</html>
