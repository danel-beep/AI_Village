<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Village viewer</title>
<style>
  :root { --bg:#1d2321; --panel:#252c29; --ink:#e8efe9; --muted:#9db0a4; --accent:#f2c14e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; display:flex; height:100vh; }
  #map { flex:1; min-width:0; display:flex; flex-direction:column; }
  canvas { width:100%; flex:1; image-rendering:pixelated; background:#5b8c4a; }
  #bar { display:flex; gap:8px; align-items:center; padding:8px; background:var(--panel); flex-wrap:wrap; }
  #bar input[type=range]#scrub { flex:1; min-width:120px; }
  button { background:#34403b; color:var(--ink); border:0; padding:6px 10px; border-radius:6px; cursor:pointer; }
  #side { width:360px; max-width:45vw; background:var(--panel); overflow:auto; padding:10px; }
  .card { background:#1f2623; border-radius:8px; padding:8px; margin-bottom:8px; cursor:pointer; }
  .card.sel { outline:2px solid var(--accent); }
  .name { font-weight:600; }
  .muted { color:var(--muted); font-size:12px; }
  .thought { font-style:italic; color:#cfe3d6; margin-top:4px; }
  #feed div { border-bottom:1px solid #333d38; padding:3px 0; font-size:12px; }
  h3 { margin:10px 0 6px; font-size:13px; color:var(--muted); text-transform:uppercase; }
  #drop { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.6); }
  #drop div { background:var(--panel); padding:24px; border-radius:12px; max-width:420px; }
  @media (max-width: 760px) { body { flex-direction:column; } #side { width:100%; max-width:none; height:45vh; } }
</style>
</head>
<body>
<div id="map">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="bar">
    <button id="play">▶</button><button id="stepb">⏭</button>
    <input id="scrub" type="range" min="0" value="0">
    <label class="muted">скорость <input id="speed" type="range" min="1" max="20" value="4"></label>
    <span id="clock"></span>
  </div>
</div>
<div id="side">
  <h3>Жители</h3><div id="cards"></div>
  <h3>События</h3><div id="feed"></div>
</div>
<div id="drop"><div>
  <p><b>AI Village</b>: открой лог прогона (<code>runs/*.jsonl</code>) или передай <code>?log=путь</code>.</p>
  <input type="file" id="file" accept=".jsonl,.json">
</div></div>
<script>
// Positions are viewer-only: the engine has no coordinates, only a graph of locations.
const POS = { market:[480,90], field:[200,170], river:[200,340], square:[480,270], forest:[760,170],
              mine:[860,340], smithy:[680,360] };
const ZONE = { market:'#c98f4a', field:'#d9c46a', river:'#4a8fc9', square:'#a9a08d', forest:'#2f6b34',
               mine:'#7d7468', smithy:'#8a5a44', home:'#b5835a' };
const COLORS = ['#f2c14e','#e4572e','#76b041','#17bebb','#c47ac0','#ff9f1c','#2ec4b6','#e71d36','#a3c4f3','#ffbf69'];
const cv = document.getElementById('c'), g = cv.getContext('2d');
let header, ticks = [], i = 0, playing = false, last = 0, frac = 1, selected = null, names = [], color = {};

function homePos(name) {
  const k = names.indexOf(name), n = names.length;
  return [120 + k * (720 / Math.max(1, n - 1)), 520];
}
function locPos(id) { return id.startsWith('home_') ? homePos(id.slice(5)) : (POS[id] || [480, 300]); }

function load(text) {
  const lines = text.split('\n').filter(Boolean).map(JSON.parse);
  header = lines[0]; ticks = lines.slice(1).filter(r => r.view);
  names = header.config.agents.map(a => a.name);
  names.forEach((n, k) => color[n] = COLORS[k % COLORS.length]);
  document.getElementById('scrub').max = ticks.length - 1;
  document.getElementById('drop').style.display = 'none';
  i = 0; frac = 1; render();
}
document.getElementById('file').onchange = e => e.target.files[0].text().then(load);
const qs = new URLSearchParams(location.search).get('log');
if (qs) fetch(qs).then(r => r.text()).then(load);

document.getElementById('play').onclick = () => { playing = !playing; document.getElementById('play').textContent = playing ? '⏸' : '▶'; };
document.getElementById('stepb').onclick = () => go(i + 1);
document.getElementById('scrub').oninput = e => go(+e.target.value, true);
function go(n, jump) { if (!ticks.length) return; i = Math.max(0, Math.min(ticks.length - 1, n)); frac = jump ? 1 : 0; render(); }

function agentXY(t, name) {
  const v = t.view.agents[name], here = names.filter(n => t.view.agents[n].location === v.location && t.view.agents[n].status === 'active');
  const [x, y] = locPos(v.location), k = here.indexOf(name), r = here.length > 1 ? 34 : 0;
  const a = k / Math.max(1, here.length) * Math.PI * 2;
  return [x + Math.cos(a) * r, y + Math.sin(a) * r];
}

function drawMap(t) {
  g.fillStyle = '#5b8c4a'; g.fillRect(0, 0, cv.width, cv.height);
  const locs = header.config.locations;
  g.strokeStyle = '#c9b98a'; g.lineWidth = 10; g.lineCap = 'round';
  for (const [id, spec] of Object.entries(locs)) for (const n of spec.neighbors) {
    const [x1, y1] = locPos(id), [x2, y2] = locPos(n); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }
  for (const n of names) { const [x1, y1] = locPos('home_' + n), [x2, y2] = locPos('square'); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
  const all = Object.keys(locs).concat(names.map(n => 'home_' + n));
  for (const id of all) {
    const [x, y] = locPos(id), home = id.startsWith('home_');
    const w = home ? 90 : 130, h = home ? 70 : 90;
    g.fillStyle = home ? ZONE.home : ZONE[id]; roundRect(x - w / 2, y - h / 2, w, h, 10); g.fill();
    if (t.view.fires.includes(id)) { g.fillStyle = `rgba(255,${90 + Math.random() * 80 | 0},0,.75)`; roundRect(x - w / 2, y - h / 2, w, h, 10); g.fill(); }
    g.fillStyle = '#10140f'; g.font = '600 12px system-ui'; g.textAlign = 'center';
    g.fillText(t.view.locations[id] || id, x, y - h / 2 + 15);
  }
}
function roundRect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

function drawAgents(prev, t) {
  for (const n of names) {
    const v = t.view.agents[n]; if (v.status !== 'active') continue;
    const [x0, y0] = agentXY(prev, n), [x1, y1] = agentXY(t, n);
    const e = Math.min(1, frac), x = x0 + (x1 - x0) * e, y = y0 + (y1 - y0) * e;
    g.fillStyle = color[n]; g.beginPath(); g.arc(x, y, 12, 0, 7); g.fill();
    g.lineWidth = n === selected ? 3 : 1.5; g.strokeStyle = n === selected ? '#fff' : '#10140f'; g.stroke();
    g.fillStyle = '#fff'; g.font = '600 11px system-ui'; g.textAlign = 'center'; g.fillText(n, x, y + 26);
    if (v.asleep) { g.fillText('z z', x + 16, y - 14); continue; }
    const said = (t.decisions[n] || {}).say;
    if (said) bubble(x, y - 20, String(said));
  }
}
function bubble(x, y, text) {
  text = text.length > 60 ? text.slice(0, 57) + '…' : text;
  g.font = '12px system-ui'; const w = Math.min(260, g.measureText(text).width + 16);
  g.fillStyle = '#fffbe8'; roundRect(x - w / 2, y - 30, w, 22, 8); g.fill();
  g.fillStyle = '#222'; g.textAlign = 'center'; g.fillText(text, x, y - 15, w - 10);
}

function render() {
  if (!ticks.length) return;
  const t = ticks[i], prev = ticks[Math.max(0, i - 1)];
  drawMap(t); drawAgents(prev, t);
  document.getElementById('scrub').value = i;
  document.getElementById('clock').textContent = `День ${prev.view.day}, ${String(prev.view.hour).padStart(2, '0')}:00`;
}

let lastPanel = -1;
function panel() {
  if (lastPanel === i || !ticks.length) return; lastPanel = i;
  const t = ticks[i], thoughts = {};
  for (let k = i; k >= 0 && Object.keys(thoughts).length < names.length; k--)
    for (const [n, d] of Object.entries(ticks[k].decisions)) if (!(n in thoughts) && d.thought) thoughts[n] = d.thought;
  document.getElementById('cards').innerHTML = names.map(n => {
    const v = t.view.agents[n], inv = Object.entries(v.inventory).map(([k, q]) => `${q} ${k}`).join(', ') || 'пусто';
    return `<div class="card ${n === selected ? 'sel' : ''}" data-n="${n}"><span class="name" style="color:${color[n]}">${n}</span>
      <span class="muted">${v.profession} · ${t.view.locations[v.location] || v.location} · ${v.status}</span>
      <div class="muted">еда ${v.satiety} · здоровье ${v.health} · ${v.coins} монет · ${inv}</div>
      <div class="thought">${esc(thoughts[n] || '')}</div></div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(el => el.onclick = () => { selected = selected === el.dataset.n ? null : el.dataset.n; lastPanel = -1; });
  const feed = [];
  for (let k = i; k >= 0 && feed.length < 40; k--) for (const e of ticks[k].events.slice().reverse()) {
    const mine = selected && (e.actor === selected || e.to.includes(selected));
    if ((selected ? mine : e.visibility !== 'private') && feed.length < 40)
      feed.push(`<div><span class="muted">д${e.day} ${String(e.hour).padStart(2, '0')}:00</span> ${esc(e.text)}</div>`);
  }
  document.getElementById('feed').innerHTML = feed.join('');
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function loop(ts) {
  const speed = +document.getElementById('speed').value, dt = (ts - last) / 1000; last = ts;
  if (playing && ticks.length) {
    frac += dt * speed / 2;
    if (frac >= 1) { if (i < ticks.length - 1) { i++; frac = 0; } else { frac = 1; playing = false; } }
  }
  render(); panel();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
