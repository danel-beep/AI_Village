<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Village</title>
<style>
  /* Layout: map canvas fills the left, a village log column on the right; stacks on phones.
     Deliberately single dark "evening in the village" look in both themes. */
  :root { --bg:#1d2321; --panel:#252c29; --card:#1f2623; --ink:#e8efe9; --muted:#9db0a4; --accent:#f2c14e;
          --btn:#34403b; --rule:#333d38; --bubble:#fffbe8; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; display:flex; height:100vh; }
  #map { flex:1; min-width:0; display:flex; flex-direction:column; }
  canvas { width:100%; flex:1; min-height:0; object-fit:contain; image-rendering:pixelated; background:#2a3a24; cursor:pointer; }
  #bar { display:flex; gap:8px; align-items:center; padding:8px; background:var(--panel); flex-wrap:wrap; }
  #bar input[type=range]#scrub { flex:1; min-width:120px; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); }
  button { background:var(--btn); color:var(--ink); border:0; padding:6px 10px; border-radius:6px; cursor:pointer; }
  #side { width:360px; max-width:45vw; background:var(--panel); overflow:auto; padding:10px; }
  .card { background:var(--card); border-radius:8px; padding:8px; margin-bottom:8px; cursor:pointer; }
  .card.sel { outline:2px solid var(--accent); }
  .name { font-weight:600; }
  .muted { color:var(--muted); font-size:12px; }
  .thought { font-style:italic; color:#cfe3d6; margin-top:4px; }
  #feed div { border-bottom:1px solid var(--rule); padding:3px 0; font-size:12px; }
  h3 { margin:10px 0 6px; font-size:13px; color:var(--muted); text-transform:uppercase; }
  #drop { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.6); }
  #drop[hidden] { display:none; }
  #drop div { background:var(--panel); padding:24px; border-radius:12px; max-width:420px; }
  @media (max-width: 760px) { body { flex-direction:column; } #side { width:100%; max-width:none; height:45vh; } }
</style>
</head>
<body>
<div id="map">
  <canvas id="c" width="960" height="640"></canvas>
  <div id="bar">
    <button id="play">▶</button><button id="stepb">⏭</button>
    <input id="scrub" type="range" min="0" value="0">
    <label class="muted">скорость <input id="speed" type="range" min="1" max="20" value="4"></label>
    <span id="clock"></span>
  </div>
</div>
<div id="side">
  <h3>Жители</h3><div id="cards"></div>
  <h3 id="diaryh" hidden>Дневник</h3><div id="diary" hidden></div>
  <h3>События</h3><div id="feed"></div>
</div>
<div id="drop"><div>
  <p><b>AI Village</b>: открой лог прогона (<code>runs/*.jsonl</code>) или передай <code>?log=путь</code>.</p>
  <input type="file" id="file" accept=".jsonl,.json">
</div></div>
<script src="pixelmap.js"></script>
<script>
const COLORS = ['#f2c14e','#e4572e','#76b041','#17bebb','#c47ac0','#ff9f1c','#2ec4b6','#e71d36','#a3c4f3','#ffbf69'];
const cv = document.getElementById('c'), g = cv.getContext('2d');
let header, ticks = [], diaries = [], i = 0, playing = false, last = 0, frac = 1, selected = null, names = [], color = {}, lastPanel = -1;

// Data-source entry point. A dropped file, ?log=, the embedded demo and a live server all feed rows through here:
// Viewer.start(headerRow) once, then Viewer.push(row) for each tick/diary row (rows may keep arriving).
function start(h) {
  header = h; ticks = []; diaries = []; i = 0; frac = 1; lastPanel = -1;
  names = header.config.agents.map(a => a.name);
  names.forEach((n, k) => color[n] = COLORS[k % COLORS.length]);
  const size = PixelMap.init(header, color); cv.width = size.width; cv.height = size.height;
  document.getElementById('drop').hidden = true;
  playing = true; document.getElementById('play').textContent = '⏸';
}
function push(row) {
  if (row.type === 'diary') diaries.push({ ...row, at: ticks.length - 1 });
  else if (row.view) { ticks.push(row); document.getElementById('scrub').max = ticks.length - 1; }
}
function load(text) {
  const lines = text.split('\n').filter(Boolean).map(JSON.parse);
  start(lines[0]); lines.slice(1).forEach(push);
}
window.Viewer = { start, push, load };
document.getElementById('file').onchange = e => e.target.files[0].text().then(load);
const qs = new URLSearchParams(location.search).get('log');
if (window.EMBEDDED_LOG) load(window.EMBEDDED_LOG);
else if (qs) fetch(qs).then(r => r.text()).then(load);

document.getElementById('play').onclick = () => { playing = !playing; document.getElementById('play').textContent = playing ? '⏸' : '▶'; };
document.getElementById('stepb').onclick = () => go(i + 1);
document.getElementById('scrub').oninput = e => go(+e.target.value, true);
function go(n, jump) { if (!ticks.length) return; i = Math.max(0, Math.min(ticks.length - 1, n)); frac = jump ? 1 : 0; render(); }
function select(n) { selected = selected === n ? null : n; lastPanel = -1; }
// Click a villager on the map to follow them (canvas uses object-fit: contain, so undo the letterboxing).
cv.onclick = e => {
  const r = cv.getBoundingClientRect(), k = Math.min(r.width / cv.width, r.height / cv.height);
  const x = (e.clientX - r.left - (r.width - cv.width * k) / 2) / k, y = (e.clientY - r.top - (r.height - cv.height * k) / 2) / k;
  const n = PixelMap.pick(x, y); if (n) select(n);
};

function render() {
  if (!ticks.length) return;
  const t = ticks[i], prev = ticks[Math.max(0, i - 1)];
  PixelMap.draw(g, { t, prev, frac, selected, time: performance.now() });
  document.getElementById('scrub').value = i;
  document.getElementById('clock').textContent = `День ${prev.view.day}, ${String(prev.view.hour).padStart(2, '0')}:00`;
}

function panel() {
  if (lastPanel === i || !ticks.length) return; lastPanel = i;
  const t = ticks[i], thoughts = {};
  for (let k = i; k >= 0 && Object.keys(thoughts).length < names.length; k--)
    for (const [n, d] of Object.entries(ticks[k].decisions)) if (!(n in thoughts) && d.thought) thoughts[n] = d.thought;
  document.getElementById('cards').innerHTML = names.map(n => {
    const v = t.view.agents[n], inv = Object.entries(v.inventory).map(([k, q]) => `${q} ${k}`).join(', ') || 'пусто';
    return `<div class="card ${n === selected ? 'sel' : ''}" data-n="${n}"><span class="name" style="color:${color[n]}">${n}</span>
      <span class="muted">${v.profession} · ${t.view.locations[v.location] || v.location} · ${v.status}</span>
      <div class="muted">еда ${v.satiety} · здоровье ${v.health} · ${v.coins} монет · ${inv}</div>
      <div class="thought">${esc(thoughts[n] || '')}</div></div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(el => el.onclick = () => select(el.dataset.n));
  diaryPanel();
  const feed = [];
  for (let k = i; k >= 0 && feed.length < 40; k--) for (const e of ticks[k].events.slice().reverse()) {
    const mine = selected && (e.actor === selected || e.to.includes(selected));
    if ((selected ? mine : e.visibility !== 'private') && feed.length < 40)
      feed.push(`<div><span class="muted">д${e.day} ${String(e.hour).padStart(2, '0')}:00</span> ${esc(e.text)}</div>`);
  }
  document.getElementById('feed').innerHTML = feed.join('');
}
function diaryPanel() {
  const own = selected ? diaries.filter(d => d.at <= i && d.entries[selected]).map(d => d.entries[selected]).reverse() : [];
  document.getElementById('diaryh').hidden = document.getElementById('diary').hidden = !selected;
  document.getElementById('diary').innerHTML = !selected ? '' : own.length ? own.map(d => `<div class="card"><span class="muted">День ${d.day}</span>
    <div class="thought">${esc(d.text)}</div>${Object.entries(d.people || {}).map(([p, note]) =>
    `<div class="muted"><b style="color:${color[p] || 'inherit'}">${esc(p)}</b>: ${esc(note)}</div>`).join('')}</div>`).join('')
    : '<div class="muted">Пока записей нет: дневник пишется ночью.</div>';
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function loop(ts) {
  const speed = +document.getElementById('speed').value, dt = (ts - last) / 1000; last = ts;
  if (playing && ticks.length) {
    frac += dt * speed / 2;
    if (frac >= 1) { if (i < ticks.length - 1) { i++; frac = 0; } else { frac = 1; playing = false; } }
  }
  render(); panel();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
