<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Village</title>
<style>
  /* Layout: map canvas fills the left, a village log column on the right; stacks on phones.
     Deliberately single dark "evening in the village" look in both themes. */
  :root { --bg:#1d2321; --panel:#252c29; --card:#1f2623; --ink:#e8efe9; --muted:#9db0a4; --accent:#f2c14e;
          --btn:#34403b; --rule:#333d38; --bubble:#fffbe8; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; display:flex; height:100vh; }
  #map { flex:1; min-width:0; display:flex; flex-direction:column; }
  canvas { width:100%; flex:1; min-height:0; object-fit:contain; image-rendering:pixelated; background:#2a3a24; cursor:pointer; }
  #bar { display:flex; gap:8px; align-items:center; padding:8px; background:var(--panel); flex-wrap:wrap; }
  #bar input[type=range]#scrub { flex:1; min-width:120px; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); }
  button { background:var(--btn); color:var(--ink); border:0; padding:6px 10px; border-radius:6px; cursor:pointer; }
  #side { width:360px; max-width:45vw; background:var(--panel); overflow:auto; padding:10px; }
  .card { background:var(--card); border-radius:8px; padding:8px; margin-bottom:8px; cursor:pointer; }
  .card.sel { outline:2px solid var(--accent); }
  .name { font-weight:600; }
  .muted { color:var(--muted); font-size:12px; }
  .thought { font-style:italic; color:#cfe3d6; margin-top:4px; }
  #feed div { border-bottom:1px solid var(--rule); padding:3px 0; font-size:12px; }
  h3 { margin:10px 0 6px; font-size:13px; color:var(--muted); text-transform:uppercase; }
  #drop { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.6); }
  #drop[hidden] { display:none; }
  #drop div { background:var(--panel); padding:24px; border-radius:12px; max-width:420px; }
  body.nolog #side { display:none; }
  body.nolog #bar { padding-right:150px; }  /* keep clear of the floating god-mode button */
  #logbtn[aria-pressed=true] { background:var(--accent); color:#1d2321; }
  @media (max-width: 760px) { body { flex-direction:column; } #side { width:100%; max-width:none; height:45vh; } }
</style>
</head>
<body>
<div id="map">
  <canvas id="c" width="960" height="640"></canvas>
  <div id="bar">
    <button id="play">▶</button><button id="stepb">⏭</button>
    <input id="scrub" type="range" min="0" value="0">
    <label class="muted">скорость <input id="speed" type="range" min="1" max="20" value="4"></label>
    <button id="lang" hidden title="язык мыслей и реплик">RU</button>
    <span id="clock"></span>
    <button id="logbtn" title="показать или скрыть лог справа">📜 Лог</button>
  </div>
</div>
<div id="side">
  <h3>Жители</h3><div id="cards"></div>
  <h3>События</h3><div id="feed"></div>
</div>
<div id="drop"><div>
  <p><b>AI Village</b>: открой лог прогона (<code>runs/*.jsonl</code>) или передай <code>?log=путь</code>.</p>
  <input type="file" id="file" accept=".jsonl,.json" multiple>
</div></div>
<script src="sprites_data.js"></script>
<script src="sprites.js"></script>
<script src="depth.js"></script>
<script src="mapgen.js"></script>
<script src="maplayer.js"></script>
<script src="plotlayer.js"></script>
<script src="buildart.js"></script>
<script src="icons.js"></script>
<script src="buildlayer.js"></script>
<script src="itemicons.js"></script>
<script src="threatlayer.js"></script>
<script src="fog.js"></script>
<script src="animallayer.js"></script>
<script src="seasonlayer.js"></script>
<script src="pixelmap.js"></script>
<script src="actors.js"></script>
<script src="camera.js"></script>
<script src="omens.js"></script>
<script src="digest.js"></script>
<script src="honors.js"></script>
<script src="replay.js"></script>
<script src="dossier.js"></script>
<script src="inspect.js"></script>
<script src="hero.js"></script>
<script src="highlights.js"></script>
<script src="mp4_muxer.js"></script>
<script src="clip.js"></script>
<script src="reel.js"></script>
<script src="sound.js"></script>
<script>
const COLORS = ['#f2c14e','#e4572e','#76b041','#17bebb','#c47ac0','#ff9f1c','#2ec4b6','#e71d36','#a3c4f3','#ffbf69'];
const cv = document.getElementById('c'), g = cv.getContext('2d');
let header, ticks = [], diaries = [], i = 0, playing = false, userPaused = false, last = 0, frac = 1, selected = null, names = [], color = {}, lastPanel = -1;

// Data-source entry point. A dropped file, ?log=, the embedded demo and a live server all feed rows through here:
// Viewer.start(headerRow) once, then Viewer.push(row) for each tick/diary row (rows may keep arriving).
function start(h) {
  header = h; ticks = []; diaries = []; i = 0; frac = 1; lastPanel = -1;
  names = header.config.agents.map(a => a.name);
  names.forEach((n, k) => color[n] = COLORS[k % COLORS.length]);
  const size = PixelMap.init(header, color); cv.width = size.width; cv.height = size.height;
  document.getElementById('drop').hidden = true;
  setPlaying(!userPaused, true);
}
// Play/pause. userPaused = the viewer pressed pause (live ticks must not resume it). Live mode listens to
// 'viewer-play' and pauses the simulation on the server too (viewer/live.js).
function setPlaying(p, quiet) {
  playing = p; userPaused = !p; document.getElementById('play').textContent = p ? '⏸' : '▶';
  if (!quiet) window.dispatchEvent(new CustomEvent('viewer-play', { detail: p }));
}
function push(row) {
  if (row.type === 'diary') diaries.push({ ...row, at: ticks.length - 1 });
  else if (row.view) {
    // Per-villager state carried from tick to tick (quarter-hour ticks: one walk hop or one hour of work spans
    // several ticks, the log only marks its first one):
    //   _goal: where they are still walking to (a move decision, kept until they arrive or decide something else),
    //          so a multi-hop trip is drawn as one continuous walk;
    //   _hop:  {from, k, of} the hop that started k ticks ago and lasts `of` ticks (1 + busy minutes / tick minutes);
    //   _acts: what they are doing, kept while the action that started it keeps them busy (chop the whole hour).
    const last = ticks.length ? ticks[ticks.length - 1] : null, step = row.view.tick_minutes || 60;
    const before = last && last._goal || {}, goal = {}, hop = {}, acts = Actors.activities(row);
    for (const [n, a] of Object.entries(row.view.agents)) {
      const d = (row.decisions || {})[n], act = d && d.action || {};
      const to = d ? act.name === 'move' && (act.args || {}).to : before[n];
      if (to && to !== a.location) goal[n] = to;
      const pa = last && last.view.agents[n], ph = last && last._hop && last._hop[n];
      if (pa && pa.location !== a.location) hop[n] = { from: pa.location, k: 0, of: 1 + Math.round((a.busy || 0) / step),
        fk: names.filter(m => last.view.agents[m].location === pa.location && last.view.agents[m].status === 'active').indexOf(n) };
      else if (ph && ph.k + 1 < ph.of && !d) hop[n] = { ...ph, k: ph.k + 1 };
      if (!acts[n] && !d && pa && pa.busy > 0 && pa.location === a.location && last._acts && last._acts[n]) acts[n] = last._acts[n];
    }
    // _mood: who is angry (robbed, cheated, attacked in the last two game hours) or fighting right now, for the
    // little icons over heads (Actors.badges); hunger and wounds come straight from the view.
    const mood = {}, keep = Math.round(120 / step), hurt = /^(robbed|steal_attempt|witness|default|theft)$/;
    for (const [n, m] of Object.entries(last && last._mood || {})) if (m.angry > 1) mood[n] = { angry: m.angry - 1 };
    for (const e of row.events || []) {
      const fight = /fight|attack|duel|brawl|hit|defend/.test(e.kind), who = [...(e.to || []), ...(fight && e.actor ? [e.actor] : [])];
      if (!fight && !hurt.test(e.kind)) continue;
      for (const n of who) if (row.view.agents[n] && (fight || n !== e.actor)) mood[n] = { ...mood[n], angry: keep, ...(fight ? { fight: 1 } : {}) };
    }
    row._goal = goal; row._hop = hop; row._acts = acts; row._mood = mood;
    ticks.push(row); document.getElementById('scrub').max = ticks.length - 1;
  }
}
function load(text) {
  const lines = text.split('\n').filter(Boolean).map(JSON.parse);
  start(lines[0]); lines.slice(1).forEach(push);
}
window.Viewer = { start, push, load, setPlaying };
// Live feed (viewer/live.js): append a row and keep following if the viewer was at the newest ticks.
window.viewerAppend = row => {
  live = true;
  const follow = i >= ticks.length - 7; push(row);
  if (follow && row.view && !userPaused) { if (ticks.length - 1 - i > 6) { i = ticks.length - 2; frac = 0; } playing = true; }
};
// Translations: sidecar <log>.ru.json from aivillage/translate.py maps original text -> Russian.
let TR = null, lang = 'en';
function tr(s) { return lang !== 'en' && TR && TR[s] || s; }
function setTr(obj) {
  if (!obj || obj.type !== 'translation') return;
  TR = obj.texts; lang = obj.lang; const b = document.getElementById('lang'); b.hidden = false; b.textContent = lang.toUpperCase();
}
document.getElementById('lang').onclick = e => {
  lang = lang === 'en' ? 'ru' : 'en'; e.target.textContent = lang.toUpperCase(); lastPanel = -1;
};
document.getElementById('file').onchange = e => {
  const fs = [...e.target.files], log = fs.find(f => f.name.endsWith('.jsonl')) || fs[0];
  fs.filter(f => f !== log).forEach(f => f.text().then(t => { setTr(JSON.parse(t)); lastPanel = -1; }));
  log.text().then(load);
};
const qs = new URLSearchParams(location.search).get('log');
if (window.EMBEDDED_TR) setTr(window.EMBEDDED_TR);
if (window.EMBEDDED_LOG) load(window.EMBEDDED_LOG);
else if (qs) {
  fetch(qs.replace(/\.jsonl$/, '') + '.ru.json').then(r => r.ok ? r.json() : null).then(setTr, () => {});
  fetch(qs).then(r => r.text()).then(load);
}

document.getElementById('play').onclick = () => setPlaying(!playing);
// The log column can be hidden to give the map the whole width; remembered per browser.
function setLog(show) {
  document.body.classList.toggle('nolog', !show); document.getElementById('logbtn').setAttribute('aria-pressed', show);
  try { localStorage.setItem('aiv-log', show ? '1' : '0'); } catch (e) {}
}
document.getElementById('logbtn').onclick = () => setLog(document.body.classList.contains('nolog'));
try { setLog(localStorage.getItem('aiv-log') !== '0'); } catch (e) { setLog(true); }
document.getElementById('stepb').onclick = () => go(i + 1);
document.getElementById('scrub').oninput = e => go(+e.target.value, true);
function go(n, jump) { if (!ticks.length) return; i = Math.max(0, Math.min(ticks.length - 1, n)); frac = jump ? 1 : 0; render(); }
// Selecting a villager (map click via PixelMap.pick, a card, or Dossier's close button) opens their dossier.
function select(n) { selected = selected === n ? null : n; lastPanel = -1; }
// Click a villager on the map to follow them, anything else to inspect it (viewer/inspect.js).
// The canvas uses object-fit: contain, so undo the letterboxing.
cv.onclick = e => {
  const r = cv.getBoundingClientRect(), k = Math.min(r.width / cv.width, r.height / cv.height);
  const x = (e.clientX - r.left - (r.width - cv.width * k) / 2) / k, y = (e.clientY - r.top - (r.height - cv.height * k) / 2) / k;
  const n = PixelMap.pick(x, y); if (n) select(n); else if (window.Inspect) Inspect.click(x, y);   // else a building or object
};

function render() {
  if (!ticks.length) return;
  const t = ticks[i], prev = ticks[Math.max(0, i - 1)];
  PixelMap.draw(g, { t, prev, frac, selected, time: performance.now(), tr, hourSec });
  if (window.Inspect) Inspect.mark(g);
  if (window.Sound) Sound.update(header, ticks, i, playing);   // music, ambience, event sounds (viewer/sound.js)
  document.getElementById('scrub').value = i;
  // Minutes run with the animation, so the clock keeps ticking while the next hour is being computed.
  // A tick is view.tick_minutes (15, or 60 in old logs); view.minute is absent in old logs.
  const m0 = prev.view.hour * 60 + (prev.view.minute || 0), m1 = t.view.hour * 60 + (t.view.minute || 0);
  const now = Math.floor(m1 > m0 && m1 - m0 <= 60 ? m0 + Math.min(0.99, frac) * (m1 - m0) : m0);
  const season = window.SeasonLayer ? SeasonLayer.label(header, prev.view.day) : '';
  document.getElementById('clock').textContent = `День ${prev.view.day}, ${String(Math.floor(now / 60)).padStart(2, '0')}:${String(now % 60).padStart(2, '0')}${season ? ' · ' + season : ''}`;
}

function panel() {
  if (lastPanel === i || !ticks.length) return; lastPanel = i;
  const t = ticks[i], thoughts = {};
  for (let k = i; k >= 0 && Object.keys(thoughts).length < names.length; k--)
    for (const [n, d] of Object.entries(ticks[k].decisions)) if (!(n in thoughts) && d.thought) thoughts[n] = d.thought;
  document.getElementById('cards').innerHTML = names.map(n => {
    const v = t.view.agents[n], inv = (window.ItemIcons ? ItemIcons.list(v.inventory) : Object.entries(v.inventory).map(([k, q]) => `${q} ${k}`).join(', ')) || 'пусто';
    return `<div class="card ${n === selected ? 'sel' : ''}" data-n="${n}"><span class="name" style="color:${color[n]}">${n}</span>
      <span class="muted">${v.profession} · ${t.view.locations[v.location] || v.location} · ${v.status}</span>
      <div class="muted">еда ${v.satiety} · здоровье ${v.health} · ${v.coins} монет · ${inv}</div>
      <div class="thought">${esc(tr(thoughts[n] || ''))}</div></div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(el => el.onclick = () => select(el.dataset.n));
  Dossier.render(selected);
  if (window.Inspect) Inspect.render();
  const feed = [];
  for (let k = i; k >= 0 && feed.length < 40; k--) for (const e of ticks[k].events.slice().reverse()) {
    const mine = selected && (e.actor === selected || e.to.includes(selected));
    if ((selected ? mine : e.visibility !== 'private') && feed.length < 40)
      feed.push(`<div><span class="muted">д${e.day} ${String(e.hour).padStart(2, '0')}:${String(e.minute || 0).padStart(2, '0')}</span> ${esc(tr(e.text))}</div>`);
  }
  document.getElementById('feed').innerHTML = feed.join('');
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

let seenLen = 0, gap = 0, lastArrive = 0, live = false, hourSec = 2, rate = 0, arrivals = 0;
function loop(ts) {
  if (window.Clip && Clip.busy()) { last = ts; requestAnimationFrame(loop); return; }   // a clip is drawing the map (viewer/clip.js)
  const speed = +document.getElementById('speed').value, dt = Math.min(.1, (ts - last) / 1000); last = ts;
  // Usual gap between live ticks; the backlog burst on connect and quick runs of ticks (night) are not counted.
  if (ticks.length > seenLen) { const now = ts / 1000, d = now - lastArrive;
    if (live && ticks.length === seenLen + 1 && d > .5 && arrivals++ > 0) gap = gap ? gap * .7 + Math.min(60, d) * .3 : Math.min(60, d);
    lastArrive = now; }
  seenLen = ticks.length;
  if (playing && ticks.length) {
    let want;   // ticks per second; the speed slider is in game hours, a tick may be a quarter of one
    const q = (ticks[Math.min(i, ticks.length - 1)].view.tick_minutes || 60) / 60;
    if (live) {
      // Live: stay a little over half an hour of game time behind the newest tick and play at the pace ticks arrive, a bit
      // faster when further behind and a bit slower when close. So a late tick only slows villagers down for a moment
      // (no "all freeze, then all run"), and a burst of ticks is caught up gently.
      const behind = ticks.length - i - frac;   // hours of game time not shown yet (tick i is done at frac 1)
      hourSec = Math.max(2 / speed * q, gap || 6 * q);
      want = behind <= 0 ? 0 : Math.max(.3, Math.min(3, 1 + (behind - .6) * .4 + Math.max(0, behind - 2) * .6)) / hourSec;
      if (behind < .15) want *= behind / .15;   // ease into the newest moment instead of stopping dead
    } else { hourSec = 2 / speed * q; want = 1 / hourSec; }
    rate += (want - rate) * (1 - Math.exp(-dt * 3));   // the speed itself changes smoothly
    frac += dt * rate;
    while (frac >= 1 && i < ticks.length - 1) { i++; frac -= 1; }
    if (frac >= 1) { frac = 1; rate = 0; if (!live) playing = false, document.getElementById('play').textContent = '▶'; }
  } else rate = 0;
  render(); panel(); Hero.refresh();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
